services:
  postgres:
    restart: unless-stopped

  server:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - server
