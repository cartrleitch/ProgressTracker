services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ProgressTracker
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  server:
    build:
      context: .
      dockerfile: ProgressTracker.Server/Dockerfile
    environment:
      ConnectionStrings__ProgressTrackerContext: "Host=postgres;Database=ProgressTracker;Username=postgres;Password=${POSTGRES_PASSWORD}"
      DataProtection__KeysPath: /keys
    volumes:
      - ./keys:/keys
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  keys: